[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "bores-framework"
version = "0.1.0"
description = "Black-Oil RE-servoir Simulation Framework."
authors = [
    { name = "tioluwa", email = "tioluwa.dev@gmail.com" }
]
maintainers = [
    { name = "tioluwa", email = "tioluwa.dev@gmail.com" }
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = [
    "reservoir-simulation", "black-oil", "eor", 
    "reservoir-engineering", "numerical-simulation",
    "multiphase-flow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.10"
dependencies = [
    "attrs>=25.3.0",
    "imageio>=2.37.0",
    "ipython>=8.37.0",
    "kaleido>=1.0.0",
    "numba>=0.63.0",
    "plotly>=6.2.0",
    "pyamg>=5.3.0",
    "scikit-image>=0.25.2",
    "trame>=3.12.0",
    "typing-extensions>=4.15.0",

    # Install MKL versions only on x86_64 Windows/Linux (via uv with numpy-mkl index)
    # For pip users, these resolve to standard PyPI numpy/scipy
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "mkl-service>=2.4.2; sys_platform != 'darwin' and platform_machine == 'x86_64'",
    "intel-cmplr-lib-rt>=2025.3.1; platform_machine == 'x86_64'",

    "cachetools>=6.2.4",
    "cattrs>=25.3.0",
    "orjson>=3.11.5",
    "types-pyyaml>=6.0.12.20250915",
    "types-cachetools>=6.2.0.20251022",
    "scipy-stubs>=1.15.3.0",
    "tqdm>=4.67.3",
    "rich>=14.3.3",
]


[tool.marimo.runtime]
pythonpath=["src"]
output_max_bytes = 10_000_000

# uv-specific: MKL-optimized numpy/scipy for x86_64 Linux/Windows
# pip users will get standard PyPI versions automatically
[[tool.uv.index]]
name = "numpy-mkl"
url = "https://urob.github.io/numpy-mkl"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
numpy = [
  { index = "numpy-mkl", marker = "sys_platform != 'darwin' and platform_machine == 'x86_64' and python_version >= '3.11'" },
]
scipy = [
  { index = "numpy-mkl", marker = "sys_platform != 'darwin' and platform_machine == 'x86_64' and python_version >= '3.11'" },
]
mkl-service = [
  { index = "numpy-mkl", marker = "sys_platform != 'darwin' and platform_machine == 'x86_64' and python_version >= '3.11'" },
]

[tool.ruff]
target-version = "py310"
line-length = 99
preview = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF",
]
ignore = ["E501", "F403", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["bores"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[project.optional-dependencies]
pyvista = [
    "pyvista[jupyter]>=0.47.0",
    "imageio-ffmpeg>=0.6.0",
]
zarr = ["zarr>=2.18.3,<3", "numcodecs>=0.12.1"]
hdf5 = ["h5py>=3.15.1"]
yaml = ["pyyaml>=6.0.0"]
meshio = ["meshio>=5.3.5"]
coolprop = ["coolprop>=6.8.0"]
pandas = ["pandas>=2.2.3"]
polars = ["polars>=1.0.0"]
dataframes = ["pandas>=2.2.3", "polars>=1.0.0"]
tbb = [
    "tbb>=2022.3.1",
    "tbb-devel>=2022.3.1",
    "tbb4py>=2022.3.1",
]

[dependency-groups]
dev = [
    "marimo>=0.19.11",
    "auto-mix-prep>=0.2.0",
    "rich>=14.0.0",
    "ruff>=0.12.1",
    "ty>=0.0.1a26",
    "watchdog>=6.0.0",
]
docs = ["zensical>=0.0.31"]
